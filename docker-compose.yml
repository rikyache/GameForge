services:
  app:
    build: .
    container_name: go-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kirill
      DB_PASSWORD: 12345
      DB_NAME: practice
      REDIS_HOST: redis
      REDIS_PORT: 6379


  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: kirill
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: practice

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirill -d practice"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"


volumes:
  postgres_data: