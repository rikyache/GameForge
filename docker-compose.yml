services:
  app:
    build: .
    container_name: go-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kirill
      DB_PASSWORD: 12345
      DB_NAME: practice


  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: kirill
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: practice

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirill -d practice"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d


volumes:
  postgres_data: